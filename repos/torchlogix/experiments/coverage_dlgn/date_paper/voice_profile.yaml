constraints:
  forbid_em_dash: true
  avoid_ai_scaffolding: true
  preserve_user_wording: true
  prefer_precise_claims: true
  policy: "These are supplied skill constraints, not claims that the source papers always follow them. Preserve technical meaning and established terms while correcting grammar and unsupported claims. Do not manufacture awkward wording to imitate errors in the corpus."
  punctuation: "Use periods, commas, semicolons, or parentheses instead of an em dash. Do not use a spaced en dash as a substitute. Retain established technical compounds and mathematical minus signs."

style_dimensions:
  rhetorical_posture_and_intent:
    summary: "An engineering argument organized around a concrete deployment constraint, the mechanism that addresses it, and a measured trade-off. The papers use an explicit author voice and repeatedly connect algorithmic choices to system behavior."
    confidence: "High across D1-D6; promotional intensity varies."
    do:
      - "Start with the specific technical bottleneck and its consequence. For this paper, connect fixed connectivity to accuracy at a declared gate budget."
      - "Use 'we propose', 'we define', and 'we evaluate' for research actions. Use the method or component name as the subject when describing its operation."
      - "State a design decision, explain why it is needed, and identify the metric or experiment that evaluates it."
      - "Keep a direct affirmative contribution statement, followed by its scope and evidence."
      - "Name the cost accompanying an accuracy benefit; qualify the result where the trade-off occurs."
    avoid:
      - "Broad opening claims about a revolution, rapid advances, or a new era when they do not establish the technical problem."
      - "Promotional adjectives as substitutes for mechanisms or measurements."
      - "Converting the papers' occasional 'first', 'optimal', or 'guarantees' language into default wording."
      - "A rhetorical opposition that introduces an irrelevant alternative merely for emphasis."

  macro_structure_fingerprints:
    summary: "Problem and motivation precede a component-based methodology; evaluation establishes the setup and metrics before comparing outcomes and resource costs."
    section_patterns:
      - "Abstract: concrete problem, limitation, proposed method, two or three mechanism details, evaluation scope, and one or two supported quantitative findings."
      - "Introduction: deployment constraint, limitation of existing choices, a motivating example or observation, proposed approach, and usually three contributions. D1 uses four."
      - "Related work: group methods by the capability or constraint being compared. End each group with the specific unresolved issue relevant to the contribution."
      - "Methodology: introduce the graph or system and its inputs/outputs with an overview figure, then explain components in processing order."
      - "Evaluation: dataset and platform, baseline definitions, training or execution protocol, metric definitions, main comparisons, ablations, and overhead."
      - "Conclusion: restate the mechanism and supported outcome; include a concrete limitation when appropriate. Separate discussion is common in longer papers, but is not mandatory for DATE."
    paragraph_patterns:
      - "Method paragraph: purpose -> representation or input -> operation -> output and reason for the choice."
      - "Results paragraph: identify comparison/figure -> quantify observation -> explain the supported interpretation -> state a relevant exception or cost."
      - "Transition: carry a named concept from the preceding paragraph into the next. A connective is optional; semantic continuity is required."
      - "Use (i), (ii), (iii) for a short parallel component list. Move long baseline/model enumerations into a table."
    title_guidance: "Five of six source titles use a name followed by a descriptive subtitle. This is an observed packaging habit, not a requirement. A descriptive title without CoverageDLGN remains appropriate for the current paper."

  sentence_mechanics:
    summary: "Short declarative sentences establish the point; longer sentences describe a mechanism, condition, or enumeration. Concrete subjects and repeated technical nouns keep the argument traceable."
    avg_sentence_len_range:
      min: 18
      max: 24
    target_basis: "A recommended section-average range, informed by the selected-passage measurements below. It is not a limit on every sentence or a measured full-corpus range."
    cadence_rules:
      - "Mix short statements of roughly 8-15 words with explanations of roughly 18-30 words. Treat these as editing guides."
      - "Review sentences longer than 35 words. Split independent claims while retaining necessary definitions and parallel lists."
      - "Keep the main subject and verb close. Move long conditions after the main clause when meaning permits."
      - "Use active voice for author decisions; use passive voice when the transformed object or experimental condition is the useful subject."
      - "Prefer three to five sentences per ordinary paragraph, but let equations and component descriptions determine exceptions."
      - "Define an acronym on first use. Keep metric names, symbols, and component names consistent afterward."
      - "Use present tense for method behavior and figure interpretation; use past tense for completed experimental actions when it clarifies the protocol."
      - "Keep lists parallel and avoid chains of 'which', 'thereby', or 'thus' linking several claims."

  lexical_preferences:
    summary: "The corpus favors concrete operations and named system metrics, with explicit explanatory transitions. Some recurring vocabulary is more ornate than the requested final style."
    preferred_terms:
      - "we propose; we present; we define; we evaluate; we observe"
      - "construct; select; map; partition; encode; predict; measure"
      - "input; output; representation; component; constraint; baseline"
      - "accuracy; throughput; latency; power consumption; memory; overhead; trade-off"
      - "under the evaluated conditions; on average; compared to; with respect to"
    discouraged_terms:
      - "novel, innovative, remarkable, superior, or robust without a precise supported meaning"
      - "lightweight or efficient without naming a size, cost, or comparison"
      - "performance when the intended metric is accuracy, time, memory, or another specific quantity"
      - "manyfold; aforementioned; it is important to note; it is worth noting"
      - "key differentiator; fundamental gap; holistic; seamless; synergistically"
    usage_notes:
      - "The sources often use 'employ', 'utilize', and 'in terms of'. Retain them when natural, but prefer a direct verb or named metric when shorter."
      - "Use 'however' only for a real contrast and 'therefore' only for a supported consequence. Do not begin consecutive paragraphs with the same connective."
      - "Treat preferred terms as options, not a phrase bank to repeat mechanically."

  technical_argument_habits:
    summary: "Define the representation and metric before interpretation, motivate a choice with a concrete example, and compare benefit with operational cost."
    claim_patterns:
      - "Given [input and constraint], we [specific operation] to [technical purpose]."
      - "[Component] transforms [defined input] into [defined output] using [operation]."
      - "Under [matched setting], [method] changes [metric] from [baseline] to [result], with [cost or uncertainty]."
      - "Figure [X] shows [observation]. The [controlled comparison] supports [bounded interpretation]."
    evidence_patterns:
      - "State the platform, workload or dataset, baseline, and metric normalization before comparative results."
      - "Use a worked example to make a design constraint tangible: D3 tool selection, D5 reward calculation, D1 throughput/fairness conflict."
      - "Report primary outcome and overhead together: D2 estimator overhead, D4 runtime/power, D5 throughput/prioritization, D6 success/latency/cost."
      - "Acknowledge a losing coordinate: D1 mix 7 fairness, D3 some Mistral execution times, D4 AGX power, D5 aggregate throughput."
      - "Explain why a proxy differs from the target: D2 energy versus emissions; D6 sequence agreement versus absolute correctness."
    refinement_for_new_drafting: "Retain the explanatory pattern but distinguish observation, interpretation, and causal evidence. The corpus sometimes draws stronger conclusions than its described controls justify; those conclusions are not a style requirement."

