    - "however"
    - "therefore"
    - "specifically"
    - "for example"
    - "to this end"
    - "next"
    - "in addition"
  banned_words:
    - "brittle"
    - "delve"
    - "dive into"
    - "embark"
    - "intricate"
    - "multifaceted"
    - "admittedly"
    - "testament"
  banned_words_policy: "Inherited skill-template defaults for new prose, not inferred corpus absences. Preserve a necessary technical term or exact quotation when a higher-priority instruction requires it."
  abstract_words_target: [140, 180]
  abstract_target_basis: "Editorial target for the requested short abstract, not a verified DATE submission limit."
  contributions_target: [3, 4]
  paragraph_sentences_target: [3, 5]
  editing: "Preserve the user's technical nouns and intended claim; repair grammar locally before rewriting a whole paragraph. Do not invent a method acronym, expand the contribution, or add results to improve rhetoric."

project_specific_constraints:
  origin: "../AGENTS.md and the current paper discussion; these are research-integrity requirements, not inferred voice. Recheck current evidence before drafting numeric claims."
  rules:
    - "Present U2 as the unified dense/convolutional construction; distinguish V3 as a dense specialization. Do not imply universal superiority."
    - "Explain connectivity throughout the network. Bound the first-layer-dominance finding to the evaluated dense factorial experiment."
    - "Do not equate structured connectivity with proven benefits from degree balancing, maximum coverage, or ancestry novelty alone."
    - "Separate achieved, reproduced, adapted, negative-reproduction, and paper-reported results; distinguish hardened validation (V) from held-out test (T)."
    - "Preserve seed counts and pairing. Give raw seeds, sample SD, paired Student-t intervals, and wins in supporting tables where required by the project. An abstract can select findings without changing their scope."
    - "Do not turn a positive mean with an interval crossing zero into an established improvement. Do not call a gain statistically significant without the relevant analysis."
    - "Label percentage-point accuracy differences explicitly. State the normalization baseline for ratios and relative percentage changes."
    - "Distinguish offline construction, training time, peak allocated GPU memory, and inference cost. Unchanged gate count does not establish unchanged physical area or energy."
    - "Describe offline fixed-index construction without added trainable routing parameters or inference operators; substantiate any measured overhead separately."

validation_checklist:
  - "Every empirical claim identifies its comparison and scope locally or through an unambiguous table reference."
  - "Every paragraph develops one technical point and connects to the surrounding argument."
  - "Every method component has a defined input, operation, and output before its benefit is asserted."
  - "Review sentences over 35 words and paragraphs outside the soft targets; do not shorten definitions merely to pass a count."
  - "Remove em dashes and generic scaffolding; check acronym consistency and user terminology."
  - "Check that observed habits, editorial targets, and project evidence rules remain distinct."

manuscript_revision_priorities:
  basis: "User feedback that the generated LaTeX reads like a report; direct rereading of previous_pdfs. These priorities refine the application of the profile."
  rules:
    - "Develop the technical context before introducing formal predecessor notation or experimental statistics. Explain why the constraint matters for learning a Boolean circuit."
    - "Write connected explanatory paragraphs. Do not compress a mechanism into several terse statements simply to meet the page budget."
    - "Use descriptive scientific subsection titles. Keep RQ labels, claim identifiers, provenance codes, and audit language out of ordinary body prose; define necessary table codes once."
    - "Introduce a comparison and explain its consequence. Avoid shorthand such as positive operating points, coordinates, boundary evidence, retained cost, and raw recipes."
    - "State a limitation where it affects interpretation, then continue the scientific argument. Do not end every paragraph with a generic disclaimer."
    - "Use precise authorial language such as we propose and we evaluate without importing unsupported novelty or causal claims from the reference papers."
    - "Preserve equations and results while explaining the relationships between their terms. Sentence-length checks cannot substitute for reading the compiled manuscript."

precedence:
  - "Explicit user instructions, subject to governing system/developer requirements."
  - "Project-specific evidence and technical constraints."
  - "Hard writing constraints supplied with the skill and compatible project style rules."
  - "Stable voice observations and actionable defaults in this profile."
  - "Soft word-count targets and occasional corpus habits."
